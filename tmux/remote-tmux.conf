# ╔══════════════════════════════════════════════════════════════╗
# ║        TMUX REMOTE FRAGMENT — the far end of the ssh        ║
# ║           teal #94e2d5 = remote, blue #8aadf4 = local       ║
# ╚══════════════════════════════════════════════════════════════╝
#
# This is the mirror image of tmux/tmux.conf, shipped to the machine
# at the other end of an ssh connection. Without it the local half of
# the navigation-forwarding feature is inert: local Ctrl+h/j/k/l gets
# forwarded into a bare remote shell instead of into the remote's own
# editor, and the passthrough below never gets a chance to hand the key
# on a second time.
#
# TWO SUPPORTED USAGES. Both are supported; use whichever the remote
# hands you.
#
#   1. Sourced into a remote tmux that already has a config of its own:
#        tmux source-file ~/.config/tmux/remote-tmux.conf
#
#   2. Used as the entire config for a fresh remote tmux:
#        tmux -f ~/.config/tmux/remote-tmux.conf new -A -s main
#
# Sourcing it twice is safe. Every option below is `set -g`, which
# replaces a value rather than appending to it, and `bind-key`
# replaces a key in place rather than stacking a second copy of it —
# both checked against a live server rather than assumed. The one
# directive that could have accumulated, the RGB entry in
# terminal-features, therefore uses `set -sg` carrying tmux's own
# defaults forward, so the replace is lossless; the local file's
# `set -as` there would have appended a second `tmux-256color:RGB` on
# every re-source. Every `set` is global for the same reason the local
# file's are: a non-global `set` of an option the server does not have
# yet fails outright, and one that it does have clobbers session state
# on the way in.
#
# Nothing in this file may shell out to a helper script from this
# dotfiles repo. Those helpers ship here and a remote is not guaranteed
# to have them, and a status segment shelling out to a missing script
# paints a literal error string on the bar at every refresh. Nesting on
# the remote is unconditional anyway — being on the far end of the
# connection IS the fact, so there is nothing to detect and nothing to
# poll. Hence the literal REMOTE badge below instead of a script call.
# A reader who feels the need for a detection helper here is reaching
# for a check the remote does not need.


# ─────────────────────────────────────────────
# Prefix
# ─────────────────────────────────────────────

# Unbind before rebinding: a bare `set -g prefix C-a` leaves C-b live
# on any server this is sourced into, and two live prefixes means a C-a
# that cannot be typed at all.
unbind C-b

# Ctrl+A, matching the local config exactly. Load-bearing in both
# directions: `send-prefix` emits THIS server's prefix, so the local
# C-a and the remote C-a have to be the same key. Let the remote pick
# something else (C-space, say) and the passthrough goes inert — the
# local C-a C-a that is meant to reach the remote editor instead types
# a literal C-a into whatever the remote pane runs, and Ctrl+h/j/k/l
# forwarding dies with it, since those keys only get forwarded onward
# by a remote tmux sitting at the same prefix.
set -g prefix C-a
bind C-a send-prefix


# ─────────────────────────────────────────────
# General
# ─────────────────────────────────────────────

set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows
set -g renumber-windows on

# Don't automatically rename windows
set -g automatic-rename off
set -g allow-rename off

# Faster key sequences
set -g repeat-time 500


# ─────────────────────────────────────────────
# Terminal / Colors
# ─────────────────────────────────────────────

# 256 color + true color support. terminal-features is set with -sg and
# an explicit full value rather than -as: -as appends, so re-sourcing
# this file would stack a duplicate tmux-256color:RGB entry, and -sg
# with tmux's own defaults written back alongside the new entry keeps
# the replace from dropping anything.
set -g default-terminal "tmux-256color"
set -sg terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,tmux-256color:RGB"


# Navigation keys are forwarded to the pane when the pane's foreground process
# owns them, and select a neighbouring pane otherwise. Exactly two things own
# them:
#
#   - a local editor  nvim / vim / view running in this pane
#   - an ssh session   ssh / mosh in this pane, whose far end runs its own tmux
#                      and forwards the key on again to its editor
#
# The ssh arm is what makes nested sessions work. Without it this server sees
# `ssh` as the pane's foreground process rather than `nvim`, concludes nothing
# owns the key, and eats it as select-pane -- so the key never reaches the
# editor on the far side of the connection.
#
# A nested session must therefore ALWAYS have a tmux at the far end, or the
# forwarded key lands in a bare remote shell. Connect with tssh (see .zshrc),
# which attaches the remote session for you. Note the trade-off runs both ways:
# from an ssh pane these keys are forwarded for as long as you stay sshed, so
# local pane selection is unreachable from it until you leave.
is_forwardable="ps -o state= -o comm= -t '#{pane_tty}' | \
    grep -iqE '^[^TXZ ]+( +|:).*?(n?vim|vim|view|ssh|mosh)(diff)?(-wrapped)?$'"

# Clear the pre-ssh-arm matcher. Nothing above sets is_vim any more, and
# sourcing a config does not unset variables it stops setting, so a server
# started before this change keeps the stale regex in its global environment
# and hands it to every new pane. Inert -- nothing reads it -- but unreclaimable
# without a server restart. Same reasoning as the set-hook -gu pair below.
set-environment -gu is_vim

# Ctrl+h/j/k/l — forward to a local editor or through an ssh session,
# otherwise move between panes.
bind-key -n C-h if-shell "$is_forwardable" \
    "send-keys C-h" \
    "select-pane -L"

bind-key -n C-j if-shell "$is_forwardable" \
    "send-keys C-j" \
    "select-pane -D"

bind-key -n C-k if-shell "$is_forwardable" \
    "send-keys C-k" \
    "select-pane -U"

bind-key -n C-l if-shell "$is_forwardable" \
    "send-keys C-l" \
    "select-pane -R"


# ─────────────────────────────────────────────
# Tmux Prefix Navigation
# ─────────────────────────────────────────────

# Ctrl+A + h/j/k/l. Note these are prefix binds, not -n binds, so they
# do not collide with the forwardable Ctrl+h/j/k/l above: the bare key
# forwards, the prefixed key moves panes. That separation is the whole
# reason the two halves of the keymap can coexist.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ─────────────────────────────────────────────
# Resize Panes
# ─────────────────────────────────────────────

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5


# ─────────────────────────────────────────────
# Maximize / Restore Pane
# ─────────────────────────────────────────────

bind m resize-pane -Z


# ─────────────────────────────────────────────
# Swap Panes
# ─────────────────────────────────────────────

bind < swap-pane -U
bind > swap-pane -D


# ─────────────────────────────────────────────
# Kill Pane
# ─────────────────────────────────────────────

bind X kill-pane


# ─────────────────────────────────────────────
# Windows
# ─────────────────────────────────────────────

# New window in the current directory, named after that directory's
# basename so the tab reads as a location instead of the foreground
# command. automatic-rename is off, so the name sticks.
bind c new-window -c "#{pane_current_path}" -n "#{b:pane_current_path}"

# Kill current window
bind x kill-window

# Rename current window
bind R command-prompt -I "#W" "rename-window '%%'"

# Previous / next window
bind -n M-Left previous-window
bind -n M-Right next-window

# Jump directly to windows
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9


# ─────────────────────────────────────────────
# Panes
# ─────────────────────────────────────────────

# Split right
bind | split-window -h -c "#{pane_current_path}"

# Split down
bind - split-window -v -c "#{pane_current_path}"


# ─────────────────────────────────────────────
# Copy Mode
# ─────────────────────────────────────────────

# Use Vim keys
setw -g mode-keys vi

# Enter copy mode
bind [ copy-mode

# Begin selection
bind -T copy-mode-vi v send -X begin-selection

# Rectangle selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Copy selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Cancel copy mode
bind -T copy-mode-vi Escape send -X cancel


# ─────────────────────────────────────────────
# Status Bar — Catppuccin Macchiato
# ─────────────────────────────────────────────

# Pinned to the top, unconditionally. status-position is a server-wide
# option with no per-client override, so the bar cannot move under the
# user here any more than it can locally.
set -g status-position top

set -g status-style "bg=#24273a,fg=#cad3f5"


# ─────────────────────────────────────────────
# Status Left — the REMOTE badge
# ─────────────────────────────────────────────

# A literal teal badge, so a glance at the far end says which machine
# you are on. Deliberately NOT a script call: there is nothing to
# detect on the far end of a connection, and this file may not depend
# on a helper script from this repo existing (see the header).
#
# It is deliberately not the local peach rounded pill either — the badge
# is bracketed and teal so the two nesting levels never read alike at a
# glance, even when both bars are on screen at once.
#
# If you are tempted to swap this for a command-prompt, a #() call, or
# an empty string, the failure mode is that the remote looks exactly
# like the local box and you type into the wrong machine.
set -g status-left-length 60

set -g status-left \
    "#[fg=#94e2d5]#[fg=#24273a,bg=#94e2d5,bold] [ REMOTE ] #[fg=#94e2d5] #S #[fg=#6e738d] │ "


# ─────────────────────────────────────────────
# Window Status — muted pills
# ─────────────────────────────────────────────

# Same lualine-style pills as the local config. The closing segment must
# reset bg to the bar colour (#24273a) or it draws on the pill's own bg
# and disappears.
setw -g window-status-format \
    "#[fg=#363a4f]#[fg=#cad3f5,bg=#363a4f] #I:#W #[fg=#363a4f,bg=#24273a]"

# Active window: lualine's visual-mode mauve #c6a0f6.
setw -g window-status-current-format \
    "#[fg=#c6a0f6]#[fg=#24273a,bg=#c6a0f6,bold] #I:#W #[fg=#c6a0f6,bg=#24273a]"

set -g window-status-separator " "


# ─────────────────────────────────────────────
# Status Right — clock and date
# ─────────────────────────────────────────────

# The local config's status-right carries three script-backed segments:
# a teal nesting hint and red/green SSH diagnostics, all three of which
# shell out to a helper script and are therefore meaningless here. What
# is left is the clock and the date, kept in the local palette so the
# two bars look like the same design once the script segments are gone.
set -g status-right-length 60

set -g status-right \
    "#[fg=#6e738d] │ #[fg=#a6da95] %H:%M #[fg=#6e738d]│ #[fg=#c6a0f6] %d-%b "


# ─────────────────────────────────────────────
# Pane Borders — the layer tell
# ─────────────────────────────────────────────

# Teal #94e2d5 is the remote/nesting colour, and it is the active-pane
# border HERE, on the far end. The local active border is blue #8aadf4
# (see tmux/tmux.conf). Different hue on purpose: with a nested pair
# on screen you have two active borders at once, and if they matched
# you could not tell which level the highlight belonged to. Do not
# "harmonise" the two into a single colour.
set -g pane-border-style "fg=#363a4f"

set -g pane-active-border-style "fg=#94e2d5"


# ─────────────────────────────────────────────
# Messages
# ─────────────────────────────────────────────

set -g message-style \
    "bg=#363a4f,fg=#cad3f5"

set -g message-command-style \
    "bg=#363a4f,fg=#cad3f5"


# ─────────────────────────────────────────────
# Status Refresh
# ─────────────────────────────────────────────

# 1s refresh so the clock stays live.
set -g status-interval 1


# ─────────────────────────────────────────────
# Reload Config
# ─────────────────────────────────────────────

# Reloads THIS file, not the local one. The remote has no tmux.conf of
# its own to reload, and pointing this at the local path would source
# the wrong fragment into the wrong server.
bind r source-file ~/.config/tmux/remote-tmux.conf \; \
    display-message "tmux remote config reloaded"
