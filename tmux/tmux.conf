# ╔══════════════════════════════════════════════════════════════╗
# ║                    TMUX CONFIGURATION                       ║
# ║         Neovim + Catppuccin Macchiato + Ctrl+A             ║
# ╚══════════════════════════════════════════════════════════════╝


# ─────────────────────────────────────────────
# Prefix
# ─────────────────────────────────────────────

unbind C-b

# Use Ctrl+A as tmux prefix
set -g prefix C-a
bind C-a send-prefix


# ─────────────────────────────────────────────
# General
# ─────────────────────────────────────────────

set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows
set -g renumber-windows on

# Don't automatically rename windows
set -g automatic-rename off
set -g allow-rename off

# Faster key sequences
set -g repeat-time 500


# ─────────────────────────────────────────────
# Terminal / Colors
# ─────────────────────────────────────────────

# 256 color + true color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",tmux-256color:RGB"


# ─────────────────────────────────────────────
# Windows
# ─────────────────────────────────────────────

# New window in the current directory, named after that directory's basename
# so the tab reads as a location ("tmux") instead of the foreground command
# ("zsh"). b: strips the path; automatic-rename is off, so the name sticks.
bind c new-window -c "#{pane_current_path}" -n "#{b:pane_current_path}"

# Kill current window
bind x kill-window

# Rename current window
bind R command-prompt -I "#W" "rename-window '%%'"

# Previous / next window
bind -n M-Left previous-window
bind -n M-Right next-window

# Jump directly to windows
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9


# ─────────────────────────────────────────────
# Panes
# ─────────────────────────────────────────────

# Split right
bind | split-window -h -c "#{pane_current_path}"

# Split down
bind - split-window -v -c "#{pane_current_path}"


# ─────────────────────────────────────────────
# Neovim / Tmux Navigation
# ─────────────────────────────────────────────

# Navigation keys are forwarded to the pane when the pane's foreground process
# owns them, and select a neighbouring pane otherwise. Exactly two things own
# them:
#
#   - a local editor  nvim / vim / view running in this pane
#   - an ssh session   ssh / mosh in this pane, whose far end runs its own tmux
#                      and forwards the key on again to its editor
#
# The ssh arm is what makes nested sessions work. Without it this server sees
# `ssh` as the pane's foreground process rather than `nvim`, concludes nothing
# owns the key, and eats it as select-pane -- so the key never reaches the
# editor on the far side of the connection.
#
# A nested session must therefore ALWAYS have a tmux at the far end, or the
# forwarded key lands in a bare remote shell. Connect with tssh (see .zshrc),
# which attaches the remote session for you. Note the trade-off runs both ways:
# from an ssh pane these keys are forwarded for as long as you stay sshed, so
# local pane selection is unreachable from it until you leave.
is_forwardable="ps -o state= -o comm= -t '#{pane_tty}' | \
    grep -iqE '^[^TXZ ]+( +|:).*?(n?vim|vim|view|ssh|mosh)(diff)?(-wrapped)?$'"

# Clear the pre-ssh-arm matcher. Nothing above sets is_vim any more, and
# sourcing a config does not unset variables it stops setting, so a server
# started before this change keeps the stale regex in its global environment
# and hands it to every new pane. Inert -- nothing reads it -- but unreclaimable
# without a server restart. Same reasoning as the set-hook -gu pair below.
set-environment -gu is_vim

# Ctrl+h/j/k/l — forward to a local editor or through an ssh session,
# otherwise move between panes.
bind-key -n C-h if-shell "$is_forwardable" \
    "send-keys C-h" \
    "select-pane -L"

bind-key -n C-j if-shell "$is_forwardable" \
    "send-keys C-j" \
    "select-pane -D"

bind-key -n C-k if-shell "$is_forwardable" \
    "send-keys C-k" \
    "select-pane -U"

bind-key -n C-l if-shell "$is_forwardable" \
    "send-keys C-l" \
    "select-pane -R"


# ─────────────────────────────────────────────
# Tmux Prefix Navigation
# ─────────────────────────────────────────────

# Ctrl+A + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ─────────────────────────────────────────────
# Resize Panes
# ─────────────────────────────────────────────

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5


# ─────────────────────────────────────────────
# Maximize / Restore Pane
# ─────────────────────────────────────────────

bind m resize-pane -Z


# ─────────────────────────────────────────────
# Swap Panes
# ─────────────────────────────────────────────

bind < swap-pane -U
bind > swap-pane -D


# ─────────────────────────────────────────────
# Kill Pane
# ─────────────────────────────────────────────

bind X kill-pane


# ─────────────────────────────────────────────
# Copy Mode
# ─────────────────────────────────────────────

# Use Vim keys
setw -g mode-keys vi

# Enter copy mode
bind [ copy-mode

# Begin selection
bind -T copy-mode-vi v send -X begin-selection

# Rectangle selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Copy selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Cancel copy mode
bind -T copy-mode-vi Escape send -X cancel


# ─────────────────────────────────────────────
# Clipboard
# ─────────────────────────────────────────────

set -g set-clipboard on


# ─────────────────────────────────────────────
# Reload Config
# ─────────────────────────────────────────────

# Reload config (file auto-loaded via XDG at ~/.config/tmux/tmux.conf)
bind r source-file ~/.config/tmux/tmux.conf \; \
    display-message "tmux config reloaded"


# ─────────────────────────────────────────────
# Status Bar — Catppuccin Macchiato (lualine-style)
# ─────────────────────────────────────────────

# Pinned to the top, unconditionally. status-position is a server-wide option
# with no per-client override, so the bar cannot move under the user.
#
# This used to be dynamic: a ./status-position script flipped the bar to the
# top only while Neovim was the foreground process of the active pane, driven
# by the client-attached / pane-focus-in hooks plus a status-right poll. All
# three call sites and the script itself are gone, so nothing can move the bar
# anymore. Restore the old behaviour from git history:
#   git show <rev>^:tmux/status-position > tmux/status-position && chmod +x \
#     tmux/status-position
#
# Sourcing a config does not clear hooks it no longer sets, so the two are
# explicitly unhooked: without this a server started before this change keeps
# running the old switcher and drags the bar back down.
set -g status-position top
set-hook -gu client-attached
set-hook -gu pane-focus-in

set -g status-style "bg=#24273a,fg=#cad3f5"


# ─────────────────────────────────────────────
# Status Left — lualine "mode" pill (session)
# ─────────────────────────────────────────────

# Mirrors the leftmost lualine section (lualine_a): a rounded pill ( ) in
# the Catppuccin Macchiato accent — lualine's command-mode peach #f5a97f —
# with the session name, so the "active session" gets the same color as in
# Neovim's command/insert mode.
set -g status-left-length 60

set -g status-left \
    "#[fg=#f5a97f]#[fg=#24273a,bg=#f5a97f,bold] #S #[fg=#f5a97f,bg=#24273a]#[fg=#6e738d] │ "


# ─────────────────────────────────────────────
# Window Status — lualine_b/c muted pills
# ─────────────────────────────────────────────

# Inactive: muted surface0 pill with rounded   edges, like the session pill.
# The closing  must reset bg to the bar color (#24273a) or it is drawn on
# the pill's own bg and becomes invisible.
setw -g window-status-format \
    "#[fg=#363a4f]#[fg=#cad3f5,bg=#363a4f] #I:#W #[fg=#363a4f,bg=#24273a]"

# Active: rounded pill in lualine's visual-mode mauve (#c6a0f6), same
# pill style as the session pill
setw -g window-status-current-format \
    "#[fg=#c6a0f6]#[fg=#24273a,bg=#c6a0f6,bold] #I:#W #[fg=#c6a0f6,bg=#24273a]"

set -g window-status-separator " "


# ─────────────────────────────────────────────
# Status Right — lualine_x/y/z segments
# ─────────────────────────────────────────────

# Maps the lualine right sections onto the same Macchiato palette:
#   - the nesting hint (teal #94e2d5, ./check-ssh p) flags that the ACTIVE
#     PANE is sshed out of this box, i.e. a second tmux layer is in play. It is
#     teal and not red/green on purpose: red/green asks "am I sshed INTO this
#     box" via #{client_pid}, this asks "is this pane sshed OUT of it" via
#     #{pane_current_command}, and the two must never read alike. check-ssh p
#     prints nothing on a non-ssh pane, so the segment collapses to empty by
#     itself.
#   - the SSH indicator (red/green, see ./check-ssh) is the diagnostics-style
#     segment
#   - the clock is muted-green text (like the progress segment)
#   - the date is the rightmost rounded pill (like the lualine_z "location"
#     section), in lualine's purple #c6a0f6 with   rounded corners
# #{client_pid} is expanded per attached client so the SSH check below only
# ever inspects the terminal that is actually on screen.
set -g status-right-length 180

set -g status-right \
    "#[fg=#94e2d5](#(~/.config/tmux/check-ssh p #{pane_current_command}))#[fg=#f38ba8,bold]#(~/.config/tmux/check-ssh u #{client_pid})#[fg=#a6da95]#(~/.config/tmux/check-ssh n #{client_pid})#[fg=#6e738d] │ #[fg=#a6da95] %H:%M #[fg=#6e738d]│ #[fg=#c6a0f6]#[fg=#24273a,bg=#c6a0f6,bold] %d-%b #[fg=#c6a0f6,bg=#24273a]"


# ─────────────────────────────────────────────
# Pane Borders
# ─────────────────────────────────────────────

set -g pane-border-style "fg=#363a4f"

set -g pane-active-border-style "fg=#8aadf4"


# ─────────────────────────────────────────────
# Messages
# ─────────────────────────────────────────────

set -g message-style \
    "bg=#363a4f,fg=#cad3f5"

set -g message-command-style \
    "bg=#363a4f,fg=#cad3f5"


# ─────────────────────────────────────────────
# Status Refresh
# ─────────────────────────────────────────────

# 1s refresh so the SSH indicator (see ./check-ssh) and the clock stay live.
set -g status-interval 1
# ------
# Plugins
# ------

# Install TPM automatically if missing
if-shell '[ ! -d "$HOME/.tmux/plugins/tpm" ]' \
  'run-shell "git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm"'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
