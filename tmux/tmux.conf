# ╔══════════════════════════════════════════════════════════════╗
# ║                    TMUX CONFIGURATION                       ║
# ║         Neovim + Catppuccin Macchiato + Ctrl+A             ║
# ╚══════════════════════════════════════════════════════════════╝


# ─────────────────────────────────────────────
# Prefix
# ─────────────────────────────────────────────

unbind C-b

# Use Ctrl+A as tmux prefix
set -g prefix C-a
bind C-a send-prefix


# ─────────────────────────────────────────────
# General
# ─────────────────────────────────────────────

set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows
set -g renumber-windows on

# Don't automatically rename windows
set -g automatic-rename off
set -g allow-rename off

# Faster key sequences
set -g repeat-time 500


# ─────────────────────────────────────────────
# Terminal / Colors
# ─────────────────────────────────────────────

# 256 color + true color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",tmux-256color:RGB"


# ─────────────────────────────────────────────
# Windows
# ─────────────────────────────────────────────

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Kill current window
bind x kill-window

# Rename current window
bind R command-prompt -I "#W" "rename-window '%%'"

# Previous / next window
bind -n M-Left previous-window
bind -n M-Right next-window

# Jump directly to windows
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9


# ─────────────────────────────────────────────
# Panes
# ─────────────────────────────────────────────

# Split right
bind | split-window -h -c "#{pane_current_path}"

# Split down
bind - split-window -v -c "#{pane_current_path}"


# ─────────────────────────────────────────────
# Neovim / Tmux Navigation
# ─────────────────────────────────────────────

# Detect Neovim/Vim in the active pane
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | \
    grep -iqE '^[^TXZ ]+( +|:).*?(n?vim|vim|view)(diff)?(-wrapped)?$'"

# Ctrl+h
bind-key -n C-h if-shell "$is_vim" \
    "send-keys C-h" \
    "select-pane -L"

# Ctrl+j
bind-key -n C-j if-shell "$is_vim" \
    "send-keys C-j" \
    "select-pane -D"

# Ctrl+k
bind-key -n C-k if-shell "$is_vim" \
    "send-keys C-k" \
    "select-pane -U"

# Ctrl+l
bind-key -n C-l if-shell "$is_vim" \
    "send-keys C-l" \
    "select-pane -R"


# ─────────────────────────────────────────────
# Tmux Prefix Navigation
# ─────────────────────────────────────────────

# Ctrl+A + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ─────────────────────────────────────────────
# Resize Panes
# ─────────────────────────────────────────────

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5


# ─────────────────────────────────────────────
# Maximize / Restore Pane
# ─────────────────────────────────────────────

bind m resize-pane -Z


# ─────────────────────────────────────────────
# Swap Panes
# ─────────────────────────────────────────────

bind < swap-pane -U
bind > swap-pane -D


# ─────────────────────────────────────────────
# Kill Pane
# ─────────────────────────────────────────────

bind X kill-pane


# ─────────────────────────────────────────────
# Copy Mode
# ─────────────────────────────────────────────

# Use Vim keys
setw -g mode-keys vi

# Enter copy mode
bind [ copy-mode

# Begin selection
bind -T copy-mode-vi v send -X begin-selection

# Rectangle selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Copy selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Cancel copy mode
bind -T copy-mode-vi Escape send -X cancel


# ─────────────────────────────────────────────
# Clipboard
# ─────────────────────────────────────────────

set -g set-clipboard on


# ─────────────────────────────────────────────
# Reload Config
# ─────────────────────────────────────────────

# Reload config (file auto-loaded via XDG at ~/.config/tmux/tmux.conf)
bind r source-file ~/.config/tmux/tmux.conf \; \
    display-message "tmux config reloaded"


# ─────────────────────────────────────────────
# Status Bar — Catppuccin Macchiato (lualine-style)
# ─────────────────────────────────────────────

set -g status-position bottom

# status-position is server-wide, so a small script flips it based on the
# active pane (see ./status-position):
#   - the hooks below apply it instantly when pane focus changes
#   - the status-right poll (runs every status-interval) catches Neovim
#     starting inside an already-active pane — no background daemon needed
set-hook -g client-attached 'run-shell "~/.config/tmux/status-position #{pane_tty}"'
set-hook -g pane-focus-in 'run-shell "~/.config/tmux/status-position #{pane_tty}"'

set -g status-style "bg=#24273a,fg=#cad3f5"


# ─────────────────────────────────────────────
# Status Left — lualine "mode" pill (session)
# ─────────────────────────────────────────────

# Mirrors the leftmost lualine section (lualine_a): a rounded pill ( ) in
# the Catppuccin Macchiato accent — lualine's normal-mode blue #8aadf4 — with
# the session name, so the "active session" gets the same color as in Neovim.
set -g status-left-length 60

set -g status-left \
    "#[fg=#8aadf4]#[fg=#24273a,bg=#8aadf4,bold] #S #[fg=#8aadf4,bg=#24273a]#[fg=#6e738d] │ "


# ─────────────────────────────────────────────
# Window Status — lualine_b/c muted pills
# ─────────────────────────────────────────────

# Inactive: muted surface0 pill with rounded   edges, like the session pill
setw -g window-status-format \
    "#[fg=#363a4f]#[fg=#cad3f5,bg=#363a4f] #I:#W #[fg=#363a4f]"

# Active: rounded blue pill, same style as the session pill
setw -g window-status-current-format \
    "#[fg=#8aadf4]#[fg=#24273a,bg=#8aadf4,bold] #I:#W #[fg=#8aadf4]"

set -g window-status-separator " "


# ─────────────────────────────────────────────
# Status Right — lualine_x/y/z segments
# ─────────────────────────────────────────────

# Maps the lualine right sections onto the same Macchiato palette:
#   - the SSH indicator (red/green, see ./check-ssh) is the diagnostics-style
#     segment
#   - the clock is muted-green text (like the progress segment)
#   - the date is the rightmost rounded pill (like the lualine_z "location"
#     section), in lualine's purple #c6a0f6 with   rounded corners
# The status-position poll (see ./status-position) silently runs first on
# every refresh so the bar moves when Neovim starts or quits inside an
# already-active pane; #{pane_tty} is expanded per attached client. The poll
# prints nothing, so the bar itself is unchanged by it.
set -g status-right-length 140

set -g status-right \
    "#(~/.config/tmux/status-position #{pane_tty})#[fg=#f38ba8,bold]#(~/.config/tmux/check-ssh u #{client_pid})#[fg=#a6da95]#(~/.config/tmux/check-ssh n #{client_pid})#[fg=#6e738d] │ #[fg=#a6da95] %H:%M #[fg=#6e738d]│ #[fg=#c6a0f6]#[fg=#24273a,bg=#c6a0f6,bold] %d-%b #[fg=#c6a0f6,bg=#24273a]"


# ─────────────────────────────────────────────
# Pane Borders
# ─────────────────────────────────────────────

set -g pane-border-style "fg=#363a4f"

set -g pane-active-border-style "fg=#8aadf4"


# ─────────────────────────────────────────────
# Messages
# ─────────────────────────────────────────────

set -g message-style \
    "bg=#363a4f,fg=#cad3f5"

set -g message-command-style \
    "bg=#363a4f,fg=#cad3f5"


# ─────────────────────────────────────────────
# Status Refresh
# ─────────────────────────────────────────────

# 1s refresh so the status-position poll responds quickly to Neovim starting
# or quitting in the active pane.
set -g status-interval 1
# ------
# Plugins
# ------

# Install TPM automatically if missing
if-shell '[ ! -d "$HOME/.tmux/plugins/tpm" ]' \
  'run-shell "git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm"'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
